stages:
  - test
  - build
  - deploy

variables:
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend"
  BACKEND_CONTAINER_NAME: "leafscan-backend"
  BACKEND_HOST_PORT: "8000"
  RUN_DB_SEEDS: "false"

backend:test:
  image: python:3.12
  stage: test
  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt -r requirements-dev.txt
  script:
    - DATABASE_URL=sqlite:///:memory: SECRET_KEY=test-secret-key-for-ci-only pytest tests/

backend:build:
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  stage: build
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$CI_PROJECT_DIR/backend"
      --dockerfile "$CI_PROJECT_DIR/backend/Dockerfile"
      --destination "$BACKEND_IMAGE:$CI_COMMIT_SHORT_SHA"
      --destination "$BACKEND_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

backend:deploy:
  image: alpine:3.20
  stage: deploy
  needs:
    - backend:build
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
      set -e

      if [ ! -f /opt/leafscan/backend.env ]; then
        echo "Missing /opt/leafscan/backend.env on deploy server"
        exit 1
      fi

      mkdir -p /opt/leafscan/uploads /opt/leafscan/models

      MODEL_MOUNT=""
      if [ -f /opt/leafscan/models/efficientnetv2s_plantvillage.onnx ]; then
        MODEL_MOUNT="-v /opt/leafscan/models/efficientnetv2s_plantvillage.onnx:/app/app/models/efficientnetv2s_plantvillage.onnx:ro"
      else
        echo "Warning: ONNX model not found at /opt/leafscan/models/efficientnetv2s_plantvillage.onnx; backend will use fallback if MODEL_PATH is missing."
      fi

      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      docker pull "$BACKEND_IMAGE:latest"

      docker stop "$BACKEND_CONTAINER_NAME" || true
      docker rm "$BACKEND_CONTAINER_NAME" || true

      docker run -d \
        --name "$BACKEND_CONTAINER_NAME" \
        --restart unless-stopped \
        --env-file /opt/leafscan/backend.env \
        -p "$BACKEND_HOST_PORT:8000" \
        -v /opt/leafscan/uploads:/app/app/uploads \
        \$MODEL_MOUNT \
        "$BACKEND_IMAGE:latest"

      if [ "$RUN_DB_SEEDS" = "true" ]; then
        docker exec "$BACKEND_CONTAINER_NAME" python database/run_seeds.py
      fi
      EOF
  rules:
    - if: '($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev") && $DEPLOY_HOST && $DEPLOY_USER && $DEPLOY_SSH_PRIVATE_KEY'
