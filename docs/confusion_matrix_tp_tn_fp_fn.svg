<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <rect width="1280" height="860" fill="#f7fbf8"/>

  <text x="640" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f2f24">
    Ma trận nhầm lẫn TP / TN / FP / FN
  </text>
  <text x="640" y="92" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#406055">
    Cách hiểu cho từng lớp bệnh trong mô hình phân loại lá cây 38 lớp: xét 1 lớp là "dương tính", các lớp còn lại là "âm tính"
  </text>

  <rect x="250" y="150" width="900" height="560" rx="18" fill="#ffffff" stroke="#b8d8c8" stroke-width="2"/>

  <rect x="430" y="150" width="720" height="100" rx="18" fill="#e7f6ee"/>
  <text x="790" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#08734a">
    Model dự đoán
  </text>

  <rect x="250" y="250" width="180" height="460" rx="18" fill="#e7f6ee"/>
  <text x="342" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#08734a" transform="rotate(-90 342 430)">
    Nhãn thật
  </text>

  <rect x="430" y="250" width="360" height="90" fill="#f0faf5" stroke="#cfe6d8"/>
  <rect x="790" y="250" width="360" height="90" fill="#f0faf5" stroke="#cfe6d8"/>
  <text x="610" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#12382b">
    Dự đoán dương tính
  </text>
  <text x="610" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">
    Model nói: thuộc lớp đang xét
  </text>
  <text x="970" y="287" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#12382b">
    Dự đoán âm tính
  </text>
  <text x="970" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#50635c">
    Model nói: không thuộc lớp đang xét
  </text>

  <rect x="430" y="340" width="160" height="210" fill="#f0faf5" stroke="#cfe6d8"/>
  <rect x="430" y="550" width="160" height="160" fill="#f0faf5" stroke="#cfe6d8"/>
  <text x="510" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12382b">
    Thật dương tính
  </text>
  <text x="510" y="452" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">
    Ảnh thật sự thuộc
  </text>
  <text x="510" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">
    lớp bệnh đang xét
  </text>
  <text x="510" y="618" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#12382b">
    Thật âm tính
  </text>
  <text x="510" y="647" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">
    Ảnh thật sự không
  </text>
  <text x="510" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#50635c">
    thuộc lớp đang xét
  </text>

  <rect x="590" y="340" width="200" height="210" fill="#e0f5e9" stroke="#85c9a6" stroke-width="2"/>
  <rect x="790" y="340" width="360" height="210" fill="#fff0e7" stroke="#f0b28d" stroke-width="2"/>
  <rect x="590" y="550" width="200" height="160" fill="#ffeef0" stroke="#ef9aa1" stroke-width="2"/>
  <rect x="790" y="550" width="360" height="160" fill="#e9f3ff" stroke="#98bce8" stroke-width="2"/>

  <text x="690" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#057a48">TP</text>
  <text x="690" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#12382b">True Positive</text>
  <text x="690" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#375249">Có bệnh</text>
  <text x="690" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#375249">và đoán đúng bệnh</text>

  <text x="970" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#d46b17">FN</text>
  <text x="970" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#4a2b19">False Negative</text>
  <text x="970" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#644734">Có bệnh nhưng model không nhận ra</text>
  <text x="970" y="494" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#644734">hoặc đoán sang lớp khác</text>
  <text x="970" y="521" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#9a4d12">Lỗi bỏ sót</text>

  <text x="690" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#c7333f">FP</text>
  <text x="690" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#4a1f24">False Positive</text>
  <text x="690" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#613941">Không phải bệnh đó</text>
  <text x="690" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#613941">nhưng model báo là bệnh đó</text>

  <text x="970" y="606" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#1769aa">TN</text>
  <text x="970" y="641" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#1a3954">True Negative</text>
  <text x="970" y="671" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3b5367">Không thuộc lớp đó</text>
  <text x="970" y="695" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3b5367">và model cũng không báo lớp đó</text>

  <rect x="120" y="742" width="1040" height="84" rx="16" fill="#ffffff" stroke="#d4e4dc"/>
  <text x="150" y="774" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#0f2f24">Công thức đánh giá:</text>
  <text x="150" y="807" font-family="Arial, sans-serif" font-size="18" fill="#33443e">
    Accuracy = (TP + TN) / tổng mẫu
    · Precision = TP / (TP + FP)
    · Recall = TP / (TP + FN)
    · F1 = 2 × Precision × Recall / (Precision + Recall)
  </text>
</svg>
